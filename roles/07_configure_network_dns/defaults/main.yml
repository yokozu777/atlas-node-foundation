# Role 07_configure_network_dns
# Stops systemd-resolved when the unit exists, then writes dns_servers into
# /etc/resolv.conf before roles that resolve internal names.
# When the list is unset, use the lab DNS address (dns_server_ip).
dns_servers: "{{ [dns_server_ip] if (dns_server_ip | default('', true) | length > 0) else ['192.168.1.1'] }}"
