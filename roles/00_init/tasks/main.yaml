- name: Wait for server to UP sshd
  become: false
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ initial_ssh_port | default(22) }}"
    delay: 1
    connect_timeout: 1
  delegate_to: localhost

