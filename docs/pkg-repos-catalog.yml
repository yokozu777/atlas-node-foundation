# Machine-readable SoT for package repo slugs and official upstream URLs.
# Human guide: pkg-repos-catalog.md  |  Client contract: pkg-repos-contract.md
#
# Phase 1 (2026-07-29): catalog complete. Infra mirror coverage noted per entry.
# Waves A–D (2026-07-30): example_leaf_lists for k8s/jenkins; docs/gates hardened.
# name == client pkg_repos[].name == infra pkg_repo_upstreams.slug (after templating).

version: 1
updated: "2026-07-30"
phase: 1

# Patterns (not concrete inventory names)
patterns:
  k8s_apt:
    name_template: "k8s-ubuntu-{{ k8s_apt_repo_version }}"
    official_url_template: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_apt_repo_version }}/deb/"
    upstream_host: pkgs.k8s.io
    family: apt
  k8s_yum:
    name_template: "k8s-{{ k8s_apt_repo_version }}"
    official_url_template: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_apt_repo_version }}/rpm/"
    upstream_host: pkgs.k8s.io
    family: yum

# Concrete slugs (static names)
repos:
  - name: debian-main
    family: apt
    official_url: "https://deb.debian.org/debian"
    upstream_host: deb.debian.org
    drop_in: "/etc/apt/sources.list.d/debian-main.sources"
    signed_by: "/usr/share/keyrings/debian-archive-keyring.gpg"
    infra_mirror: present
    notes: "Suites from ansible_distribution_release (+ updates)."

  - name: debian-security
    family: apt
    official_url: "https://deb.debian.org/debian-security"
    upstream_host: deb.debian.org
    drop_in: "/etc/apt/sources.list.d/debian-security.sources"
    signed_by: "/usr/share/keyrings/debian-archive-keyring.gpg"
    infra_mirror: present
    notes: "Suite {{ release }}-security."

  - name: debian-non-free
    family: apt
    official_url: "https://deb.debian.org/debian"
    upstream_host: deb.debian.org
    drop_in: "/etc/apt/sources.list.d/debian-non-free.sources"
    signed_by: "/usr/share/keyrings/debian-archive-keyring.gpg"
    infra_mirror: present
    notes: "Same Debian host tree; Components contrib/non-free/non-free-firmware (bookworm+)."

  - name: ubuntu
    family: apt
    official_url: "https://archive.ubuntu.com/ubuntu"
    upstream_host: archive.ubuntu.com
    drop_in: "/etc/apt/sources.list.d/ubuntu.sources"
    signed_by: "/usr/share/keyrings/ubuntu-archive-keyring.gpg"
    infra_mirror: present
    notes: "release, updates, backports, security suites in template."

  - name: debian-containerd
    family: apt
    official_url: "https://download.docker.com/linux/debian"
    upstream_host: download.docker.com
    drop_in: "/etc/apt/sources.list.d/debian-containerd.sources"
    infra_mirror: present
    notes: "Docker CE / containerd for Debian."

  - name: ubuntu-containerd
    family: apt
    official_url: "https://download.docker.com/linux/ubuntu"
    upstream_host: download.docker.com
    drop_in: "/etc/apt/sources.list.d/ubuntu-containerd.sources"
    infra_mirror: present
    notes: "Docker CE / containerd for Ubuntu."

  - name: pgdg-apt
    family: apt
    official_url: "https://apt.postgresql.org/pub/repos/apt"
    upstream_host: apt.postgresql.org
    drop_in: "/etc/apt/sources.list.d/pgdg-apt.sources"
    signed_by: "/usr/share/keyrings/postgresql.asc"
    infra_mirror: present
    notes: >-
      Suite {{ release }}-pgdg. Legacy enable_repo_pgdg / enable_repo_pgdg_apt
      on Debian/Ubuntu. Infra pkg_repo_upstreams present (Phase 3).

  - name: pgdg-yum
    family: yum
    official_url: "https://download.postgresql.org/pub/repos/yum"
    upstream_host: download.postgresql.org
    drop_in: "/etc/yum.repos.d/pgdg-yum.repo"
    infra_mirror: present
    notes: >-
      baseurl path under mirror: /{{ pgsql_version }}/redhat/rhel-{{ major }}-x86_64/.
      Legacy enable_repo_pgdg / enable_repo_pgdg_yum on Oracle. Infra upstream present (Phase 3).

  - name: yum_docker-ce-stable-9
    family: yum
    official_url: "https://download.docker.com/linux/centos/9/x86_64/stable"
    upstream_host: download.docker.com
    drop_in: "/etc/yum.repos.d/yum_docker-ce-stable-9.repo"
    infra_mirror: present
    notes: "OL9 / EL9 Docker CE. Legacy flag enable_repo_yum_docker_ce_stable_9."

  - name: yum_docker-ce-stable-10
    family: yum
    official_url: "https://download.docker.com/linux/centos/10/x86_64/stable"
    upstream_host: download.docker.com
    drop_in: "/etc/yum.repos.d/yum_docker-ce-stable-10.repo"
    infra_mirror: present
    notes: "OL10 / EL10 Docker CE."

  - name: gitlab-runner-ubuntu
    family: apt
    official_url: "https://packages.gitlab.com/runner/gitlab-runner/ubuntu"
    upstream_host: packages.gitlab.com
    drop_in: "/etc/apt/sources.list.d/gitlab-runner.sources"
    infra_mirror: present
    notes: >-
      Client drop-in written by atlas-gitlab-runner (not foundation 13_configure_repo).
      Warm flag enable_repo_gitlab_runner_ubuntu.

  - name: gitlab-runner-debian
    family: apt
    official_url: "https://packages.gitlab.com/runner/gitlab-runner/debian"
    upstream_host: packages.gitlab.com
    drop_in: "/etc/apt/sources.list.d/gitlab-runner.sources"
    infra_mirror: present
    notes: >-
      Client drop-in written by atlas-gitlab-runner (not foundation 13_configure_repo).
      Warm flag enable_repo_gitlab_runner_debian.

  - name: gitlab-runner-el
    family: yum
    official_url: "https://packages.gitlab.com/runner/gitlab-runner/el/9/x86_64"
    upstream_host: packages.gitlab.com
    drop_in: "/etc/yum.repos.d/gitlab-runner.repo"
    infra_mirror: present
    notes: >-
      EL9 x86_64 pin for nginx path_prefix (same pattern as yum_docker-ce-stable-9).
      Client written by atlas-gitlab-runner. Warm flag enable_repo_gitlab_runner_el.

  - name: OL9_baseos
    family: yum
    official_url: "https://yum.oracle.com/repo/OracleLinux/OL9/baseos/latest/x86_64/"
