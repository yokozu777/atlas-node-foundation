name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: unit + syntax + ansible-lint + hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.16,<2.21" -r requirements-dev.txt

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Public CI gates
        run: |
          chmod +x run.sh tests/run_ci.sh
          ./tests/run_ci.sh
