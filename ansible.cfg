[defaults]
filter_plugins = ./filter_plugins
host_key_checking = false
forks = 50
interpreter_python = auto
callbacks_enabled = timer, profile_tasks, profile_roles
gather_facts = false
gathering = explicit
roles_path = roles
# Tag-split clusterctl invocations (separate ansible-playbook processes) need facts
# from 00_gather_facts to survive into later --tags. jsonfile + workspace path:
#   clusterctl sets ANSIBLE_CACHE_PLUGIN_CONNECTION under workspace/<id>/
#   ./run.sh sets the same under CLUSTER_WORKSPACE_ROOT/.ansible_facts_cache
# Do NOT set fact_caching_connection here (clusterctl repo convention).
fact_caching = jsonfile
fact_caching_timeout = 86400

[ssh_connection]
pipelining = true
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m
