# Example secrets overlay for ./run.sh
# Usage:
#   cp examples/secrets.example.yml /path/to/node-secrets.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/node-secrets.yml
#   EXTRA_VARS_FILE=/path/to/node-secrets.yml ./run.sh
#
# These keys override group_vars/all/atlas-node-foundation.yml. Do not commit real secrets.
# Prefer init_ssh_connect: key and leave password fields unused.

# Bootstrap / SSH (only needed when init_ssh_connect: password)
initial_password: "CHANGEME"

# Opt-in password changes (roles 03_configure_users)
# change_root_password: true
new_root_password: "CHANGEME"
# enable_system_user_password: true
system_user_password: "CHANGEME"

